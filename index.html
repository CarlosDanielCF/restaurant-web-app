<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons for all browsers and devices -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/android-chrome-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/android-chrome-512x512.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#1975ff" />

    <meta content="Santiago_Quirumbay" name="author" />

    <title>Teikio</title>
    <meta
      name="description"
      content="Un sistema de restaurante es una solución completa de gestión de pedidos diseñada para mejorar la eficiencia y el flujo de trabajo en los restaurantes. Con una interfaz fácil de usar y altamente personalizable, este sistema permite a los restaurantes automatizar muchas de las tareas diarias, ahorrando tiempo y mejorando la experiencia del cliente."
    />

    <meta
      name="keywords"
      content="restaurante, app, doña yoli, sistema para restaurantes"
    />
  </head>
  <body>
    <div id="root">
      <div
        id="startup-status"
        role="status"
        style="
          max-width: 440px;
          margin: 15vh auto;
          padding: 24px;
          font: 16px/1.6 system-ui;
          color: #134e4a;
        "
      >
        <strong>Iniciando el restaurante…</strong>
        <p id="startup-message">
          Cargando la aplicación. Mantén esta pestaña activa.
        </p>
      </div>
    </div>
    <script>
      window.setTimeout(function () {
        var message = document.getElementById('startup-message');
        if (message)
          message.textContent =
            'La carga está tardando. Comprueba la terminal de Vite y que esta dirección coincida con su puerto. Después recarga la página. No reinicies operaciones pendientes.';
      }, 20000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
