<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="/branding/point-restaurant-logo.png"
    />
    <link rel="apple-touch-icon" href="/branding/point-restaurant-logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#002443" />

    <meta content="Santiago_Quirumbay" name="author" />

    <title>Point Restaurant</title>
    <meta
      name="description"
      content="Point Restaurant — Sistema de gestión para restaurantes."
    />

    <meta
      name="keywords"
      content="Point Restaurant, software, gestión de restaurantes"
    />
  </head>
  <body>
    <div id="root">
      <div
        id="startup-status"
        role="status"
        style="
          max-width: 440px;
          margin: 15vh auto;
          padding: 24px;
          font: 16px/1.6 system-ui;
          color: #134e4a;
        "
      >
        <strong>Iniciando el restaurante…</strong>
        <p id="startup-message">
          Cargando la aplicación. Mantén esta pestaña activa.
        </p>
      </div>
    </div>
    <script>
      window.setTimeout(function () {
        var message = document.getElementById('startup-message');
        if (message)
          message.textContent =
            'La carga está tardando. Comprueba la terminal de Vite y que esta dirección coincida con su puerto. Después recarga la página. No reinicies operaciones pendientes.';
      }, 20000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
